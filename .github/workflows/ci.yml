name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"
      - name: Install
        run: uv sync --locked --extra dev --extra loadtest
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: webhook-receiver:ci
          # Layer cache between runs (GitHub Actions cache backend).
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: >-
          docker run --rm --entrypoint python webhook-receiver:ci -c
          "import webhook_receiver.api.app, webhook_receiver.worker.app, loadtest.run"

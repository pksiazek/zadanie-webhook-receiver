# api + 3 workers (x WORKER_CONCURRENCY slots) + Jaeger, sharing one
# SQLite file on a named volume. Scale with `--scale worker=N`.

x-healthcheck-timing: &healthcheck-timing
  interval: 5s
  timeout: 3s
  retries: 3
  start_period: 10s

services:
  api:
    build: .
    image: webhook-receiver:local
    command: ["api"]
    # tini as PID 1: forwards SIGTERM even before the app installs
    # its own handlers, and reaps zombies.
    init: true
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - webhook-data:/data
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      jaeger:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready',
          timeout=2).status == 200 else 1)
      <<: *healthcheck-timing

  worker:
    image: webhook-receiver:local
    command: ["worker"]
    init: true
    restart: unless-stopped
    deploy:
      replicas: 3
    volumes:
      - webhook-data:/data
    environment:
      WORKER_CONCURRENCY: "20"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # The API creates the schema at startup; workers start after it.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:9100/health',
          timeout=2).status == 200 else 1)
      <<: *healthcheck-timing
    # Longer than SHUTDOWN_GRACE_SECONDS (10 s), so Docker does not
    # SIGKILL a worker while it finishes in-flight events.
    stop_grace_period: 20s

  jaeger:
    # Jaeger v2 all-in-one: OTLP (4317 gRPC, 4318 HTTP) is on by default.
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

volumes:
  webhook-data: {}
